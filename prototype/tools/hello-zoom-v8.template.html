<title>ElectronToInterface Prototype v8</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/*@V7CSS@*/
/* ---------- v8: a program of several lines ---------- */
.codebox.multi{display:block; padding:10px 0; font-size:13px}
.cl{display:flex; min-height:24px}
.cl .ln{width:32px; flex:none; text-align:right; padding-right:10px; color:var(--ink3); user-select:none}
.cl code{white-space:pre}
.cl.on .ln{color:var(--accent); font-weight:600}
.edit-area{width:100%; min-height:150px; resize:vertical; border:1px solid var(--accent); border-radius:10px; background:var(--surface); color:var(--ink); font:14px/1.6 var(--mono); padding:10px 12px; tab-size:4}
.run-row{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:8px}
.run-row .fine{flex-basis:100%}
.stale{padding:12px 14px; border:1.5px solid var(--t-nl); border-radius:10px; font-size:14px; line-height:1.55; color:var(--ink2); display:grid; gap:8px}
.stale b{color:var(--t-nl)}
.pbtn{border:1px solid var(--rule); background:var(--surface); border-radius:8px; padding:2px 8px; font:12px var(--sans); color:var(--ink2); cursor:pointer; min-height:28px}
.pbtn:hover{color:var(--accent); border-color:var(--accent)}
/* L1 */
.v-lines{display:grid; gap:6px; overflow-x:auto; padding:2px}
.v-lines .row{display:flex; align-items:center; gap:14px}
.v-lines .ln{font:14px var(--mono); color:var(--ink3); width:18px; text-align:right; flex:none}
.el-line{font:clamp(16px,2vw,22px) var(--mono); padding:8px 14px; white-space:pre; text-align:left; min-width:min(100%,520px)}
.el-line.blank{color:var(--ink3); font:14px var(--sans)}
/* L2 */
.byte-lines{display:grid; gap:10px}
.byte-line{display:grid; grid-template-columns:52px minmax(0,1fr); gap:8px; align-items:start}
.byte-line .lh{font:12px var(--mono); color:var(--ink3); padding-top:10px}
.byte-line .bytes{grid-template-columns:repeat(auto-fill,minmax(44px,1fr)); gap:6px}
.byte-line .byte{min-height:56px; padding:8px 0 6px}
.byte-line .b-ch{font-size:16px}
/* L3 */
.tok-lines{display:grid; gap:10px; overflow-x:auto; padding:2px}
.tok-line{display:flex; align-items:stretch; gap:6px; flex-wrap:wrap}
.tok-line .lh{font:12px var(--mono); color:var(--ink3); width:44px; flex:none; align-self:center}
.chip-tok{display:flex; flex-direction:column; align-items:flex-start; gap:1px; padding:6px 10px; min-height:52px; font:17px var(--mono); white-space:pre; text-align:left}
.chip-tok small{font:600 10px var(--mono); letter-spacing:.02em}
.chip-tok.t-name{border-color:var(--t-name)} .chip-tok.t-name small{color:var(--t-name)}
.chip-tok.t-op{border-color:var(--t-op)} .chip-tok.t-op small{color:var(--t-op)}
.chip-tok.t-string{border-color:var(--t-str)} .chip-tok.t-string small{color:var(--t-str)}
.chip-tok.t-mark{border-color:var(--t-nl); border-style:dashed; color:var(--ink3); font:13px var(--sans); justify-content:center}
.chip-tok.t-mark small{color:var(--t-nl)}
.gap{align-self:center; font:12px var(--mono); color:var(--ink3)}
/* L4 */
.tree{overflow-x:auto; padding:2px}
.tbox{border:1.5px solid var(--rule2); border-radius:12px; padding:8px 10px 10px; display:grid; gap:8px; min-width:max-content; transition:border-color .15s, background-color .15s}
.tbox.on{border-color:var(--accent); background:var(--accent-soft)}
.tbox.leafy{border:0; padding:0}
.tkids{display:flex; flex-wrap:wrap; gap:10px 12px; align-items:flex-start}
.tkids.col{flex-direction:column}
.tfield{display:grid; gap:4px}
.tfield > .fl{font:11px var(--mono); color:var(--ink3)}
.tleaf{font:17px var(--mono); padding:6px 12px; min-height:44px; white-space:pre}
.tleaf.lf-name{border-color:var(--t-name)} .tleaf.lf-str{border-color:var(--t-str)}
/* L5 */
.code-group{display:grid; gap:4px; align-content:start}
.code-group h4{margin:8px 0 2px; font-size:12px; font-weight:600; color:var(--ink3); display:flex; justify-content:space-between; gap:8px}
.code-group h4:first-child{margin-top:0}
.bstep{grid-template-columns:22px minmax(0,1fr) auto}
.bstep .ops{display:flex; flex-direction:column; align-items:flex-end; gap:1px}
.bstep .runs{font:11px var(--sans); color:var(--ink3)}
.bstep.never .w{color:var(--ink3); text-decoration:line-through; text-decoration-color:var(--rule2)}
.bstep.now{background:var(--sunk)}
.runbar{display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; padding:10px 12px; border:1px solid var(--rule); border-radius:10px; background:var(--surface); font-size:13px; color:var(--ink2)}
.runbar b{color:var(--ink)}
.runchips{display:flex; gap:4px; flex-wrap:wrap}
.runchip{min-width:36px; min-height:32px; border:1.5px solid var(--rule2); border-radius:999px; background:var(--surface); font:500 12px var(--sans); color:var(--ink2); cursor:pointer; padding:0 10px}
.runchip[aria-pressed="true"]{border-color:var(--accent); background:var(--accent); color:var(--on-accent)}
.timeline{display:flex; flex-wrap:wrap; gap:3px}
.tdot{width:14px; height:14px; border-radius:4px; border:1px solid var(--rule2); background:var(--surface); padding:0; cursor:pointer}
.tdot.g{border-radius:50%}
.tdot.done{background:var(--ink3); border-color:var(--ink3)}
.tdot.cur{background:var(--accent); border-color:var(--accent)}
.frames{display:grid; gap:8px}
.frame{border:1.5px solid var(--rule2); border-radius:12px; background:var(--surface); padding:10px; display:grid; gap:8px}
.frame.top{border-color:var(--accent)}
.frame h4{margin:0; font-size:12px; font-weight:600; color:var(--ink2); display:flex; justify-content:space-between; gap:8px}
.frame h4 span{font-weight:400; color:var(--ink3)}
.frame .plates{min-height:0}
.vars{display:flex; flex-wrap:wrap; gap:6px}
.var{display:inline-flex; gap:6px; align-items:center; padding:3px 8px; border:1px solid var(--rule); border-radius:8px; font:12px var(--mono); background:var(--sunk)}
.var .badge{width:18px; height:18px; font-size:11px}
.became{font:12px var(--mono); color:var(--ink3)}
/* L6/L7 */
.hblock{border:1px solid var(--rule); border-radius:10px; overflow:hidden; background:var(--sunk)}
.hblock + .hblock{margin-top:12px}
.handoffs{display:grid; gap:12px; align-content:start}
.folded{padding:12px 14px; border:1.5px solid var(--accent); border-radius:10px; background:var(--accent-soft); font-size:14px; line-height:1.55; color:var(--ink2)}
.folded b{color:var(--ink)}
.never-note{padding:12px 14px; border:1.5px dashed var(--rule2); border-radius:10px; font-size:14px; color:var(--ink2)}
.ilist .runs{margin-left:auto; font:11px var(--sans); color:var(--ink3)}
.ilist h4{margin:8px 0 2px; font-size:12px; font-weight:600; color:var(--ink3)}
.ilist h4:first-child{margin-top:0}
.pathtbl td.pn{color:var(--ink3); text-align:right}
/* L8/L9 */
.linetabs{display:flex; flex-wrap:wrap; gap:6px}
.linetab{min-height:40px; padding:0 14px; border:1.5px solid var(--rule2); border-radius:999px; background:var(--surface); font:14px var(--mono); cursor:pointer; color:var(--ink2)}
.linetab[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft); color:var(--ink)}
.outbox.multi{display:block}
.outbox .ol{display:block}
.outbox .ol.on{background:rgba(147,174,255,.18)}
.box-lbl.sel .tt{color:var(--on-accent); border-color:currentColor}
@media (min-width:921px) and (max-width:1180px){ .body{grid-template-columns:280px 150px minmax(0,1fr)} }
@media (max-width:920px){ .byte-line{grid-template-columns:minmax(0,1fr)} .byte-line .lh{padding-top:0} .tok-line .lh{width:100%} }

  1:'You typed '+LINES.length+' lines and clicked Run. Your editor saved them on the [[disk|disk]] as a file called <b>'+FILE+'</b>. Highlighted words, like that one, open a short explanation.',
  2:'A disk can’t hold letters as such: it stores [[byte|bytes]], numbers from 0 to 255. So each character of your program was saved as a number, using an agreement called [[utf8|UTF-8]]. Even the spaces at the start of a line, and the ends of lines, are stored.',
  3:'To understand code, Python first needs its words, just as you read words rather than single letters. When you run the file, the operating system reads its '+NB+' bytes into [[ram|RAM]]; Python [[encoding|decodes]] them into text using [[utf8|UTF-8]] and picks out the meaningful pieces, called [[token|tokens]]. In Python, indentation matters, so the tokens also mark where an indented block starts and ends.',
  4:'Words alone don’t say what goes with what. So Python works out the [[structure|structure]]: which lines belong inside the function, which belong inside the loop, and what each line does, recorded as boxes inside boxes.',
  5:'Boxes describe meaning, but they aren’t something a program can carry out step by step. So Python compiles them into lists of simple steps, called [[code|bytecode]]: one list for your file, and a separate one for greet. By default, CPython interprets bytecode rather than compiling your program to native machine code. Then it runs them, and some steps run more than once.',
  6:'Steps don’t carry themselves out. Something has to read each one and do it: the [[py|interpreter]], Python’s own program, written in [[clang|C]]. Think of a kitchen: your bytecode is the recipe, the interpreter is the cook, and this C code is how the cook knows how to do each kind of step. A step that runs again can run different C the second time, because Python rewrites busy steps into faster forms.',
  7:'The interpreter is a program too, so it also needs something to run on. When Python itself was built, a [[compiler|compiler]] turned its C code into [[machine|machine code]], the only language your [[cpu|CPU]] understands. Each kind of step has its own piece of machine code, called a handler.',
  8:'print now has text to show, but programs aren’t allowed to touch the screen themselves. On a typical Linux terminal, Python eventually asks the kernel to write the bytes to standard output, using a [[syscall|system call]]: once for each line your program prints. (In a Windows console, Python uses a different call, WriteConsoleW.)',
  9:'Bytes still aren’t something you can see. Your [[terminal|terminal]] turns them back into letters, looks up each letter’s shape in a [[font|font]], and lights up [[pixel|pixels]] on your screen.'

var NODE_NAME = {Module:'Your file', FunctionDef:'Define a function', arguments:'What it takes', arg:'One input', Expr:'One statement', Call:'Call a function',

    + UTF8_TABLE.map(function(r){ return '<tr><td>'+esc(r[0])+'</td><td>'+r[1]+'</td><td>'+r[1].split(' ').length+'</td></tr>'; }).join('') + '</tbody></table>';

    var cs = getComputedStyle(document.documentElement);
    var ink = parseHex(cs.getPropertyValue('--ink')), surf = parseHex(cs.getPropertyValue('--surface'));
    var rule = cs.getPropertyValue('--rule').trim(), acc = cs.getPropertyValue('--accent').trim(), inkS = cs.getPropertyValue('--ink').trim();
    var off = document.createElement('canvas'), o = off.getContext('2d', {willReadFrequently:true});
    o.font = font; var adv = o.measureText('M').width, pad = 2, H = 28, base = 21, W = Math.ceil(pad*2 + adv*OUT.length);
    off.width = W; off.height = H; o.font = font; o.fillStyle = '#000'; o.textBaseline = 'alphabetic'; o.fillText(OUT, pad, base);
    var data = o.getImageData(0,0,W,H).data;
    var i = state.el.idx, x0 = Math.floor(pad + adv*i), x1 = Math.ceil(pad + adv*(i+1)), w = x1 - x0;
    var dpr = Math.max(1, window.devicePixelRatio || 1);
    var avail = Math.max(140, (big.parentElement.clientWidth || 300) - 220);
    var cell = Math.max(8, Math.min(18, Math.floor(Math.min(avail/w, 480/H))));
    big.width = Math.round(w*cell*dpr); big.height = Math.round(H*cell*dpr); big.style.width = (w*cell)+'px'; big.style.height = (H*cell)+'px';
    var b = big.getContext('2d'); b.setTransform(dpr,0,0,dpr,0,0);
    var full = 0, part = 0;
    for (var y=0;y<H;y++) for (var x=0;x<w;x++) {
      var al = data[((y*W)+(x0+x))*4+3], t = al/255;
      if (al>=200) full++; else if (al>0) part++;
      b.fillStyle = 'rgb('+Math.round(surf[0]+(ink[0]-surf[0])*t)+','+Math.round(surf[1]+(ink[1]-surf[1])*t)+','+Math.round(surf[2]+(ink[2]-surf[2])*t)+')';
      b.fillRect(x*cell, y*cell, cell, cell);
    }
    b.strokeStyle = rule; b.lineWidth = 1; b.beginPath();
    for (x=0;x<=w;x++){ b.moveTo(x*cell+0.5,0); b.lineTo(x*cell+0.5,H*cell); }
    for (y=0;y<=H;y++){ b.moveTo(0,y*cell+0.5); b.lineTo(w*cell,y*cell+0.5); }
    b.stroke();
    if (OUT[i]!==' ') { b.font = '400 '+(size*cell)+'px '+fam; b.textBaseline = 'alphabetic'; b.strokeStyle = acc; b.lineWidth = 2; b.strokeText(OUT[i], (pad + adv*i - x0)*cell, base*cell); }
    line.width = Math.round(W*dpr); line.height = Math.round(H*dpr); line.style.width = W+'px'; line.style.height = H+'px';
    var l = line.getContext('2d'); l.setTransform(dpr,0,0,dpr,0,0); l.clearRect(0,0,W,H);
    l.font = font; l.fillStyle = inkS; l.textBaseline = 'alphabetic'; l.fillText(OUT, pad, base);
    l.strokeStyle = acc; l.lineWidth = 1; l.strokeRect(x0+0.5, 0.5, w-1, H-1);
    var mid = 'rgb('+Math.round((surf[0]+ink[0])/2)+','+Math.round((surf[1]+ink[1])/2)+','+Math.round((surf[2]+ink[2])/2)+')';
    document.getElementById('pxStats').innerHTML =
      '<div>One character cell: <b>'+w+' × '+H+'</b> pixels</div>'
      + '<div><span class="sw" style="background:'+inkS+'"></span><b>'+full+'</b> fully lit</div>'
      + '<div><span class="sw" style="background:'+mid+'"></span><b>'+part+'</b> partly lit</div>'
      + '<div><span class="sw" style="background:rgb('+surf.join(',')+')"></span><b>'+(w*H-full-part)+'</b> dark</div>'
      + '<div><span class="olsw"></span>the font’s outline</div>'
      + '<div>Each square is one pixel, drawn by your browser just now.'+ltag('observed')+'</div>';
    var s = screenPx();
    document.getElementById('screenFact').innerHTML = 'Your screen has <b>'+s.w+' × '+s.h+'</b> pixels: about <b>'+s.mp.toFixed(1)+' million</b>. Most displays create colors using red, green and blue subpixels<span class="rgb" aria-hidden="true"><i style="background:#E5484D"></i><i style="background:#30A46C"></i><i style="background:#3E63DD"></i></span>. The screen redraws the whole picture many times a second, typically 60.'+ltag('observed');
    var ps = document.getElementById('pxStat');
    if (ps) ps.textContent = OUT[i]===' ' ? 'All '+(w*H)+' pixels of its cell stay dark.' : 'Here, '+full+' pixels are fully lit and '+part+' are partly lit.';
  });
}

/* ---------- Navigation ---------- */
var reduce = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : {matches:false};
var busy = false, skipHash = false, playing = false, playTimer = null;
function stopPlay(){ playing = false; clearTimeout(playTimer); }
function setHash(L){ var h = '#level-'+L; if (location.hash!==h) { skipHash = true; try { location.hash = h; } catch(e){ skipHash = false; } } }
function go(L, el, how, opts){
  if (busy || L<1 || L>9) return;
  stopPlay(); opts = opts || {};
  var from = state.el, fromLevel = state.level;
  var target = el || bestMatch(state.el, L), view = document.getElementById('view'), origin = view.querySelector('.el.sel');
  function commit(){
    if (L>=8 && fromLevel>=5 && fromLevel<=7) state.outLine = outLineFromRun(state.run);
    state.level = L; state.el = L===9 && !el ? E['px-'+state.outLine+'-0'] : target; syncRun(); renderAll();
    if (!opts.noHash) setHash(L);
    if (view.getBoundingClientRect().top < 0) view.scrollIntoView({block:'start'});
    if (opts.focus) { var s = view.querySelector('[data-el="'+state.el.id+'"]'); if (s) s.focus({preventScroll:true}); }
  }
  if (how==='none' || !view.animate) { commit(); return; }
  busy = true;
  if (reduce.matches) {
    view.animate([{opacity:1},{opacity:0}], {duration:110}).onfinish = function(){ commit(); view.animate([{opacity:0},{opacity:1}], {duration:150}).onfinish = function(){ busy = false; }; };
    return;
  }
  var zin = how==='in';
  if (origin) { var r = origin.getBoundingClientRect(), v = view.getBoundingClientRect(); view.style.transformOrigin = (r.left+r.width/2-v.left)+'px '+(r.top+r.height/2-v.top)+'px'; }
  else view.style.transformOrigin = '50% 20%';
  view.animate([{opacity:1, transform:'scale(1)'},{opacity:0, transform: zin?'scale(1.35)':'scale(0.9)'}], {duration:120, easing:'cubic-bezier(.4,0,1,1)'}).onfinish = function(){
    commit(); view.style.transformOrigin = '50% 0';
    view.animate([{opacity:0, transform: zin?'scale(0.95)':'scale(1.05)'},{opacity:1, transform:'scale(1)'}], {duration:170, easing:'cubic-bezier(0,0,.2,1)'}).onfinish = function(){ busy = false; };
  };
}
function zoomIn(focus){ if (state.level<9) go(state.level+1, null, 'in', {focus:focus}); }
function zoomOut(focus){ if (state.level>1) go(state.level-1, null, 'out', {focus:focus}); }
function select(id, focus){
  state.el = E[id]; syncRun(); renderSide(); renderView();
  if (focus) { var s = document.querySelector('#view [data-el="'+id+'"]'); if (s) s.focus({preventScroll:true}); }
}
var PREFIX = {5:'bc-', 6:'c-', 7:'cpu-'};
function setRun(r){
  if (r<0 || r>=NRUN) return false;
  state.run = r; state.el = E[PREFIX[state.level]+TL[r].s]; renderSide(); renderView(); return true;
}
function listFor(L){ return L===9 ? pxList() : LV[L]; }
function step(delta){
  if (state.level>=5 && state.level<=7 && state.run>=0) return setRun(state.run+delta);
  var list = listFor(state.level), i = list.indexOf(state.el), j = Math.max(0, Math.min(list.length-1, i+delta));
  if (j!==i) select(list[j].id, false);
  return j!==i;
}
function play(){
  if (playing) { stopPlay(); renderView(); return; }
  playing = true;
  if (state.run>=NRUN-1) setRun(0); else renderView();
  (function tick(){
    playTimer = setTimeout(function(){
      if (!playing || state.level!==5) { stopPlay(); return; }
      if (!step(1) || state.run===NRUN-1) { stopPlay(); renderView(); return; }
      tick();
    }, reduce.matches ? 1300 : 950);
  })();
}

document.addEventListener('click', function(e){
  var t = e.target.closest('button'); if (!t || t.disabled) return;
  var dlg = document.getElementById('dlg');
  if (t.hasAttribute('data-close')) { dlg.close(); return; }
  if (t.hasAttribute('data-dlgback')) { dlgHistory.pop(); var prev = dlgHistory[dlgHistory.length-1]; if (prev==='__index') openIndex(); else openCard(prev, false); return; }
  if (t.hasAttribute('data-index')) { openIndex(); return; }
  if (t.hasAttribute('data-label')) { if (!dlg.open) dlgHistory = []; openCard('labels'); return; }
  if (t.hasAttribute('data-tab')) { setTab(t.getAttribute('data-tab')); return; }
  if (t.hasAttribute('data-term')) { if (!dlg.open) dlgHistory = []; openCard(t.getAttribute('data-term')); return; }
  if (t.id==='conceptsBtn') { openIndex(); return; }
  if (t.hasAttribute('data-edit')) { state.editing = true; if (state.draft===null) state.draft = SRC; renderSide(); var ta = document.getElementById('editArea'); if (ta) ta.focus(); return; }
  if (t.hasAttribute('data-cancel')) { state.editing = false; renderSide(); renderView(); return; }
  if (t.hasAttribute('data-run')) { var ta2 = document.getElementById('editArea'); if (ta2) state.draft = ta2.value; state.editing = false; renderAll(); return; }
  if (t.hasAttribute('data-restore')) { state.draft = null; state.editing = false; renderAll(); return; }
  if (t.hasAttribute('data-run-of')) { stopPlay(); setRun(+t.getAttribute('data-run-of')); return; }
  if (t.hasAttribute('data-outline')) { state.outLine = +t.getAttribute('data-outline'); state.el = state.level===9 ? E['px-'+state.outLine+'-0'] : state.el; renderSide(); renderView(); return; }
  if (t.hasAttribute('data-el')) { stopPlay(); select(t.getAttribute('data-el'), true); }
  else if (t.hasAttribute('data-go')) { var L = +t.getAttribute('data-go'); go(L, null, L>state.level?'in':L<state.level?'out':'none'); }
  else if (t.hasAttribute('data-zoom')) { if (t.getAttribute('data-zoom')==='in') zoomIn(false); else zoomOut(false); }
  else if (t.hasAttribute('data-step')) { stopPlay(); step(+t.getAttribute('data-step')); var nb = document.querySelector('[data-step="'+t.getAttribute('data-step')+'"]'); if (nb && !nb.disabled) nb.focus({preventScroll:true}); }
  else if (t.hasAttribute('data-play')) { play(); }
  else if (t.hasAttribute('data-copy')) {
    var txt = t.getAttribute('data-copy');
    var done = function(){ t.textContent = 'Copied'; setTimeout(function(){ t.textContent = 'Copy'; }, 1400); };
    var fallback = function(){ var c = t.previousElementSibling, r = document.createRange(); r.selectNodeContents(c); var s = getSelection(); s.removeAllRanges(); s.addRange(r); t.textContent = 'Selected'; setTimeout(function(){ t.textContent = 'Copy'; }, 1400); };
    try { navigator.clipboard.writeText(txt).then(done, fallback); } catch(err) { fallback(); }
  }
});
document.addEventListener('input', function(e){
  if (e.target && e.target.id==='editArea') {
    var was = state.draft!==null && state.draft!==SRC;
    state.draft = e.target.value;
    var now = state.draft!==SRC;
    if (was!==now) { renderView(); var f = document.querySelector('#codePane .fine'); if (f) f.textContent = now ? 'Edited. The zoom view on the right is now out of date.' : 'Type your changes, then click Run. Nothing is analyzed while you type.'; }
  }
});
document.getElementById('dlg').addEventListener('click', function(e){ if (e.target===this) this.close(); });

function setTab(k){
  state.tryTab = k;
  state.tryOpen = true;
  var sec = document.querySelector('#view .try');
  if (sec) { sec.outerHTML = tryHtml(state.level); var b = document.getElementById('tab-'+k); if (b) b.focus({preventScroll:true}); }
}
document.addEventListener('keydown', function(e){
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (document.getElementById('dlg').open) return;
  var tg = e.target, tag = tg && tg.tagName;
  if (tg && tg.getAttribute && tg.getAttribute('role')==='tab' && (e.key==='ArrowRight' || e.key==='ArrowLeft')) {
    e.preventDefault();
    var ks = TABS.map(function(x){ return x[0]; }), i = ks.indexOf(state.tryTab);
    setTab(ks[(i + (e.key==='ArrowRight' ? 1 : ks.length-1)) % ks.length]);
    return;
  }
  if (tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT' || (tg && tg.isContentEditable)) return;
  if (e.key==='ArrowRight') { e.preventDefault(); stopPlay(); step(1); var s1 = document.querySelector('#view .el.sel'); if (s1) s1.focus({preventScroll:true}); }
  else if (e.key==='ArrowLeft') { e.preventDefault(); stopPlay(); step(-1); var s2 = document.querySelector('#view .el.sel'); if (s2) s2.focus({preventScroll:true}); }
  else if (e.key==='ArrowDown') { e.preventDefault(); zoomIn(true); }
  else if (e.key==='ArrowUp') { e.preventDefault(); zoomOut(true); }
});
document.addEventListener('toggle', function(e){ if (e.target && e.target.id==='tryBox') state.tryOpen = e.target.open; }, true);
window.addEventListener('hashchange', function(){
  if (skipHash) { skipHash = false; return; }
  var mm = /^#level-([1-9])$/.exec(location.hash);
  if (mm && +mm[1]!==state.level) go(+mm[1], null, +mm[1]>state.level?'in':'out', {noHash:true});
});

/* ---------- Theme ---------- */
var root = document.documentElement, themeBtn = document.getElementById('themeBtn');
var darkMQ = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : {matches:false};
function isDark(){ var d = root.getAttribute('data-theme'); return d ? d==='dark' : darkMQ.matches; }
function paintThemeBtn(){
  var dark = isDark();
  themeBtn.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
  themeBtn.innerHTML = dark
    ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>'
    : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>';
}
try { var th = localStorage.getItem('eti-theme'); if (th==='dark' || th==='light') root.setAttribute('data-theme', th); } catch(e) {}
themeBtn.addEventListener('click', function(){
  var next = isDark() ? 'light' : 'dark'; root.setAttribute('data-theme', next);
  try { localStorage.setItem('eti-theme', next); } catch(e) {}
  paintThemeBtn(); if (state.level===9) drawPixels();
});
if (darkMQ.addEventListener) darkMQ.addEventListener('change', function(){ paintThemeBtn(); if (state.level===9) drawPixels(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ if (state.level===9) drawPixels(); });
var rsz; window.addEventListener('resize', function(){ clearTimeout(rsz); rsz = setTimeout(function(){ if (state.level===9) drawPixels(); }, 150); });
try { if (window.matchMedia('(max-width: 920px)').matches) document.getElementById('mapDetails').removeAttribute('open'); } catch(e) {}

paintThemeBtn();
renderAll();
})();
</script>
