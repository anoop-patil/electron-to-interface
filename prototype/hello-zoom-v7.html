<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<title>ElectronToInterface Prototype v7</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: left = your program + a live map of your computer; middle = depth gauge; right = the zoom stage. Stacks on phones. */
:root{
  --page:#ECE9E2; --surface:#FFFFFF; --sunk:#F6F4EF;
  --ink:#1D1C1A; --ink2:#4F4B45; --ink3:#6A655C; --rule:#E2DED5; --rule2:#CFCABF;
  --accent:#2F55C9; --accent-soft:rgba(47,85,201,.10); --on-accent:#FFFFFF;
  --t-name:#6E3FA3; --t-op:#5C574F; --t-str:#2E7045; --t-nl:#8A5A12;
  --k-move:#1D7570; --k-math:#2E7045; --k-cmp:#8A5A12; --k-jump:#6E3FA3;
  --tint-1:#F9F4EA; --tint-2:#F8F4EC; --tint-3:#F7F4EE; --tint-4:#F6F4F0; --tint-5:#F5F4F2;
  --tint-6:#F3F4F4; --tint-7:#F1F3F5; --tint-8:#EFF2F6; --tint-9:#EEF2F7;
  --term-bg:#1D1C1A; --term-fg:#EDEBE6;
  --sans:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0F0F0E; --surface:#1C1B19; --sunk:#232220;
    --ink:#EDEBE6; --ink2:#BDB8AE; --ink3:#9C978D; --rule:#2D2C28; --rule2:#4A4843;
    --accent:#93AEFF; --accent-soft:rgba(147,174,255,.16); --on-accent:#141412;
    --t-name:#C7A6F2; --t-op:#B7B2A8; --t-str:#86CC9B; --t-nl:#E2B465;
    --k-move:#6CCFC6; --k-math:#86CC9B; --k-cmp:#E2B465; --k-jump:#C7A6F2;
    --tint-1:#1B1814; --tint-2:#1A1815; --tint-3:#1A1816; --tint-4:#191817; --tint-5:#181818;
    --tint-6:#171819; --tint-7:#16181A; --tint-8:#16181B; --tint-9:#15181C;
    --term-bg:#0B0B0A; --term-fg:#EDEBE6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#0F0F0E; --surface:#1C1B19; --sunk:#232220;
  --ink:#EDEBE6; --ink2:#BDB8AE; --ink3:#9C978D; --rule:#2D2C28; --rule2:#4A4843;
  --accent:#93AEFF; --accent-soft:rgba(147,174,255,.16); --on-accent:#141412;
  --t-name:#C7A6F2; --t-op:#B7B2A8; --t-str:#86CC9B; --t-nl:#E2B465;
  --k-move:#6CCFC6; --k-math:#86CC9B; --k-cmp:#E2B465; --k-jump:#C7A6F2;
  --tint-1:#1B1814; --tint-2:#1A1815; --tint-3:#1A1816; --tint-4:#191817; --tint-5:#181818;
  --tint-6:#171819; --tint-7:#16181A; --tint-8:#16181B; --tint-9:#15181C;
  --term-bg:#0B0B0A; --term-fg:#EDEBE6;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--page); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased}
code,pre,kbd{font-family:var(--mono)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
button{font:inherit; color:inherit}

.app{max-width:1500px; margin:0 auto; padding-inline:clamp(16px,2vw,28px); padding-block:clamp(12px,2vw,24px)}
.shell{background:var(--surface); border:1px solid var(--rule); border-radius:16px; overflow:clip}

.topbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 14px 10px 20px; border-bottom:1px solid var(--rule)}
.brand{display:flex; align-items:center; gap:10px; margin-right:auto; font-weight:600; font-size:16px; letter-spacing:-.01em}
.tag{font:500 12px var(--mono); color:var(--ink2); border:1px solid var(--rule); border-radius:999px; padding:4px 10px; white-space:nowrap}
.tag-proto{color:var(--t-nl); border-color:currentColor; font-family:var(--sans)}
.btn{height:44px; padding:0 14px; display:inline-flex; align-items:center; gap:8px; border-radius:10px; border:1px solid var(--rule); background:transparent; color:var(--ink); font:500 14px var(--sans); cursor:pointer; white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn:disabled{opacity:.45; cursor:not-allowed; background:transparent}
.btn-primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600}
.btn-primary:hover{background:var(--accent); filter:brightness(1.07)}
.btn-primary:disabled,.btn-primary:disabled:hover{background:var(--sunk); border-color:var(--rule); color:var(--ink3); filter:none; opacity:1}
.btn-sm{height:36px; padding:0 12px; font-size:13px}
.icon-btn{width:44px; padding:0; justify-content:center}

/* Concept tags: tap to open a plain explanation inside the app */
.term{display:inline; border:0; margin:0; padding:0 5px; border-radius:6px; background:var(--accent-soft); font:inherit; font-weight:500; color:var(--accent); cursor:pointer; -webkit-box-decoration-break:clone; box-decoration-break:clone}
.term:hover{background:var(--accent); color:var(--on-accent)}
b .term,.term b{font-weight:inherit}

.body{display:grid; grid-template-columns:310px 168px minmax(0,1fr)}

/* Left pane */
.side{padding:22px 18px; display:flex; flex-direction:column; gap:22px; border-right:1px solid var(--rule); min-width:0}
.side > *{min-width:0}
.pane-h{display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:8px}
.pane-h h2{margin:0; font-size:13px; font-weight:600; color:var(--ink2)}
.meta{font:12px var(--mono); color:var(--ink3)}
.codebox,.outbox{border:1px solid var(--rule); border-radius:10px; background:var(--sunk); font:15px/1.6 var(--mono); overflow-x:auto}
.codebox{display:flex; padding:12px 12px 12px 0}
.codebox .ln{width:32px; flex:none; text-align:right; padding-right:10px; color:var(--ink3); user-select:none}
.codebox code{white-space:pre}
.outbox{padding:10px 14px; white-space:pre; min-height:48px; display:flex; align-items:center}
.outbox .wait{font:13px var(--sans); color:var(--ink3); white-space:normal}
.outbox .dim{opacity:.4}
.outbox.fresh{animation:pop .6s ease-out}
@keyframes pop{0%{background:var(--accent-soft)}100%{background:var(--sunk)}}
.c-name{color:var(--t-name)} .c-op{color:var(--t-op)} .c-string{color:var(--t-str)} .c-nl{color:var(--ink3)}
.hl{background:var(--accent-soft); box-shadow:inset 0 -2px 0 var(--accent)}

/* Machine map: every track is minmax(0,1fr) so long notes wrap instead of widening the column */
.map{display:grid; grid-template-columns:minmax(0,1fr); gap:6px}
.map-intro{margin:0 0 6px; font-size:12px; color:var(--ink3)}
.part{display:block; width:100%; min-width:0; text-align:left; border:1.5px solid var(--rule); border-radius:10px; background:var(--surface); padding:8px 10px; cursor:pointer; transition:border-color .2s, background-color .2s}
.part:hover{border-color:var(--ink3)}
.part.on{border-color:var(--accent); background:var(--accent-soft)}
.part.mini{padding:4px 10px; border-width:1px}
.part.mini .p-name{font-size:12px; font-weight:500; color:var(--ink2)}
.p-top{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:0 8px}
.p-name{font-size:13px; font-weight:600}
.p-name small{font-weight:400; color:var(--ink3); margin-left:4px}
.p-speed{font-size:11px; color:var(--ink3)}
.p-note{display:block; margin-top:2px; font:12px/1.45 var(--mono); color:var(--ink2); overflow-wrap:anywhere}
.part.on .p-note{color:var(--ink)}
.p-note:empty{display:none}
.group{border:1.5px dashed var(--rule2); border-radius:12px; padding:8px; display:grid; grid-template-columns:minmax(0,1fr); gap:6px; min-width:0}
.group.on{border-color:var(--accent)}
.g-title{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:0 8px; border:0; background:none; padding:0 2px 2px; cursor:pointer; text-align:left; width:100%; min-width:0}
.g-title b{font-size:13px}
.g-title b small{font-weight:400; color:var(--ink3)}
.g-title span{font-size:11px; color:var(--ink3)}
.twin{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:6px}
.flow{font-size:11px; color:var(--ink3); text-align:center; line-height:1.3}
.keys{display:flex; flex-wrap:wrap; gap:6px 12px; font-size:12px; color:var(--ink3)}
kbd{font:500 11px var(--mono); border:1px solid var(--rule2); border-bottom-width:2px; border-radius:5px; padding:1px 6px; color:var(--ink2); background:var(--surface)}
.map-details summary{display:none}

/* Depth gauge */
.gauge{padding:22px 12px 22px 18px; display:flex; flex-direction:column; border-right:1px solid var(--rule); min-width:0}
.g-group{font-size:12px; font-weight:600; color:var(--ink3); margin-bottom:6px}
.g-list{list-style:none; margin:0; padding:0; border-left:2px solid var(--rule)}
.g-machine{border-left-style:dashed}
.g-item{display:flex; align-items:center; gap:10px; width:100%; height:40px; padding:0 8px 0 0; border:0; background:none; cursor:pointer; color:var(--ink3); text-align:left; border-radius:0 8px 8px 0}
.g-item:hover{background:var(--sunk)}
.g-tick{flex:none; width:10px; height:2px; margin-left:-2px; background:var(--rule2)}
.g-n{font:12px var(--mono); min-width:10px}
.g-label{font-size:14px}
.g-item.past .g-tick{background:var(--ink3)}
.g-item.past .g-label{color:var(--ink2); font-weight:500}
.g-item.current .g-tick{width:18px; height:3px; background:var(--accent)}
.g-item.current .g-n{color:var(--accent); font-weight:600}
.g-item.current .g-label{color:var(--ink); font-weight:600}
.g-handoff{margin:12px 0; padding:10px 0; border-block:1px dashed var(--rule2); display:flex; flex-direction:column; font-size:12px; line-height:1.4; color:var(--ink3)}
.g-handoff strong{color:var(--ink2); font-weight:600}
.g-legend{margin-top:auto; padding-top:28px; display:grid; gap:8px; font-size:12px; color:var(--ink2)}
.g-legend b{font-weight:600; color:var(--ink3)}
.lg{display:flex; align-items:center; gap:8px}
.lg i{width:22px; border-top:2px solid var(--ink2)}

.g-legend button{display:grid; gap:8px; border:0; background:none; padding:6px 0; text-align:left; cursor:pointer; color:inherit; font:inherit; border-radius:8px}
.g-legend button:hover b{color:var(--accent)}

/* Stage */
.stage{min-width:0; padding:24px clamp(16px,4vw,48px) 40px; transition:background-color .35s ease}
.stage[data-level="1"]{background:var(--tint-1)} .stage[data-level="2"]{background:var(--tint-2)} .stage[data-level="3"]{background:var(--tint-3)}
.stage[data-level="4"]{background:var(--tint-4)} .stage[data-level="5"]{background:var(--tint-5)} .stage[data-level="6"]{background:var(--tint-6)}
.stage[data-level="7"]{background:var(--tint-7)} .stage[data-level="8"]{background:var(--tint-8)} .stage[data-level="9"]{background:var(--tint-9)}
#view{display:flex; flex-direction:column; gap:20px; transform-origin:50% 0}
.crumbs{display:flex; flex-wrap:wrap; align-items:center; gap:4px 6px; font-size:13px; color:var(--ink3)}
.crumbs button{border:0; background:none; padding:6px 2px; cursor:pointer; color:var(--ink3); text-decoration:underline; text-decoration-color:var(--rule2); text-underline-offset:3px}
.crumbs button:hover{color:var(--accent); text-decoration-color:currentColor}
.crumbs .here{color:var(--ink); font-weight:500}
.lvl-head{display:flex; justify-content:space-between; align-items:flex-end; gap:12px 20px; flex-wrap:wrap}
.lvl-num{font:13px var(--mono); color:var(--ink3)}
h1{margin:4px 0 0; font-size:clamp(26px,3.2vw,34px); font-weight:600; letter-spacing:-.015em; line-height:1.15; text-wrap:balance}
.badges{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.honesty{display:inline-flex; align-items:center; gap:8px; min-height:36px; padding:0 14px; border:1.5px solid var(--ink2); border-radius:999px; background:transparent; font:500 13px var(--sans); color:var(--ink2); white-space:nowrap; cursor:pointer}
.honesty:hover{background:var(--sunk)}
.h-illustrative{border-color:var(--t-nl); color:var(--t-nl)}
.h-dot{flex:none; width:7px; height:7px; border-radius:50%; background:currentColor}
.ltag{display:inline-flex; align-items:center; gap:5px; margin-left:8px; padding:1px 8px; border:1.5px solid var(--ink3); border-radius:999px; background:transparent; font:500 11px var(--sans); color:var(--ink3); vertical-align:1px; cursor:pointer; white-space:nowrap}
.ltag:hover{background:var(--surface)}
.ltag .h-dot{width:6px; height:6px}
.lbl-list{display:grid; gap:10px}
.lbl-row{display:grid; grid-template-columns:150px minmax(0,1fr); gap:12px; align-items:start}
.lbl-row .honesty{cursor:default; justify-self:start}
.lbl-row p{margin:0; font-size:14px; line-height:1.55; color:var(--ink2)}
.proto{display:inline-flex; align-items:center; padding:6px 12px; border:1px solid var(--t-nl); border-radius:999px; font-size:12px; font-weight:500; color:var(--t-nl); white-space:nowrap}
.bridge{margin:0; max-width:64ch; font-size:18px; line-height:1.6; color:var(--ink2); text-wrap:pretty}
.bridge b{color:var(--ink); font-weight:600}
.crossed{margin:0; font-size:14px; color:var(--ink2); display:flex; gap:10px; align-items:center}
.crossed::before{content:""; flex:none; width:24px; border-top:1.5px dashed var(--ink3)}

.visual{background:var(--surface); border:1.5px solid var(--rule2); border-radius:14px; padding:20px 22px 22px; min-width:0; display:grid; gap:18px}

.v-cap{display:flex; justify-content:space-between; gap:6px 16px; flex-wrap:wrap; font-size:13px; color:var(--ink3)}
.sub{margin:0; font-size:14px; line-height:1.6; color:var(--ink2); max-width:70ch}
.sub b{color:var(--ink); font-weight:600}
.tt{font:500 11px var(--mono); color:var(--ink3); border:1px solid var(--rule); border-radius:5px; padding:0 5px; margin-left:6px; white-space:nowrap; vertical-align:1px}
.panel{border:1px solid var(--rule); border-radius:12px; background:var(--sunk); padding:14px 16px; min-width:0}
.panel h3{margin:0 0 10px; font-size:13px; font-weight:600; color:var(--ink2)}
.panel h3 span{font-weight:400; color:var(--ink3)}

.el{cursor:pointer; background:transparent; border:1.5px solid var(--rule2); border-radius:8px; color:var(--ink); transition:border-color .12s, background-color .12s}
.el:hover{border-color:var(--ink3)}

/* L1 */
.v-line{display:flex; align-items:center; gap:14px; overflow-x:auto; padding:2px}
.v-line .ln{font:14px var(--mono); color:var(--ink3)}
.el-line{font:clamp(18px,2.4vw,28px) var(--mono); padding:14px 18px; white-space:pre}
.v-file{display:flex; align-items:center; gap:10px; font-size:14px; color:var(--ink2)}
.v-file svg{flex:none; color:var(--ink3)}
/* L2 */
.bytes{display:grid; grid-template-columns:repeat(auto-fill,minmax(52px,1fr)); gap:8px}
.byte{display:flex; flex-direction:column; align-items:center; gap:2px; padding:10px 0 8px; min-height:64px}
.b-ch{font:18px var(--mono)}
.b-num{font:12px var(--mono); color:var(--ink3)}
.bits{display:grid; grid-template-columns:repeat(8,minmax(0,52px)); gap:6px; margin-top:4px}
.bitcol{display:flex; flex-direction:column; align-items:center; gap:4px}
.bit{width:100%; height:40px; display:grid; place-items:center; border-radius:8px; font:600 16px var(--mono); border:1.5px solid var(--rule2); color:var(--ink3); background:var(--surface)}
.bit.one{background:var(--ink); border-color:var(--ink); color:var(--surface)}
.bitval{font:12px var(--mono); color:var(--ink3)}
.bitval.one{color:var(--ink); font-weight:600}
.sum{margin:12px 0 0; font:15px var(--mono); color:var(--ink)}
/* L3 */
.toks{display:flex; flex-wrap:wrap; gap:14px 12px; align-items:flex-start}
.tok-col{display:flex; flex-direction:column; gap:6px}
.tok{font:22px var(--mono); padding:10px 14px; min-height:56px; white-space:pre}
.tok.t-name{border-color:var(--t-name)} .tok.t-op{border-color:var(--t-op)} .tok.t-string{border-color:var(--t-str)}
.tok.t-newline,.tok.t-endmarker{border-color:var(--t-nl); color:var(--ink2)}
.tok.t-endmarker{font:16px var(--sans); color:var(--ink3)}
.enc{display:flex; align-items:center; justify-content:center; min-height:56px; padding:0 12px; border:1.5px dashed var(--rule2); border-radius:8px; font:15px var(--mono); color:var(--ink3)}
.tok-type{font:600 11px var(--mono)}
.ty-name{color:var(--t-name)} .ty-op{color:var(--t-op)} .ty-string{color:var(--t-str)} .ty-newline,.ty-endmarker{color:var(--t-nl)} .ty-enc{color:var(--ink3)}
.tok-plain{font-size:12px; color:var(--ink3)}
.cols-wrap{overflow-x:auto; padding:2px 2px 6px}
.cols{display:grid; grid-template-columns:66px repeat(22, minmax(26px,1fr)); gap:4px 3px; min-width:700px; align-items:stretch}
.cols .rh{font-size:12px; font-weight:600; color:var(--ink3); align-self:center}
.cols .c{display:grid; place-items:center; min-height:30px; border-radius:6px; font:13px var(--mono); color:var(--ink3); background:var(--sunk)}
.cols .c.ch{font-size:18px; color:var(--ink); background:transparent}
.cols .c.num{font-size:12px; color:var(--ink2)}
.cols .c.col{font-size:11px; background:transparent}
.cols .c.in{background:var(--accent-soft); color:var(--ink)}
.cols .c.ch.in{color:var(--accent); font-weight:600}
.span-tok{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; min-height:52px; padding:4px 2px; font:600 12px var(--mono); overflow:hidden}
.span-tok small{font:11px var(--sans); color:var(--ink3); font-weight:400; white-space:nowrap}
.span-tok.t-name{border-color:var(--t-name); color:var(--t-name)} .span-tok.t-op{border-color:var(--t-op); color:var(--t-op)}
.span-tok.t-string{border-color:var(--t-str); color:var(--t-str)} .span-tok.t-newline{border-color:var(--t-nl); color:var(--t-nl)}
.extra-toks{display:flex; flex-wrap:wrap; gap:10px}
.xt{display:flex; align-items:center; gap:10px; padding:8px 12px; border:1.5px dashed var(--rule2); border-radius:10px; font-size:13px; color:var(--ink2)}
.xt b{font:600 12px var(--mono)}
.xt.el{border-style:solid; border-color:var(--t-nl); text-align:left}
.pos{margin:0; font-size:15px; color:var(--ink2)}
.pos code{font-size:14px; color:var(--ink); background:var(--sunk); border:1px solid var(--rule); border-radius:5px; padding:0 6px}
/* Try it: command on top, then tabs */
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--rule); overflow-x:auto}
.tab{border:0; border-bottom:2px solid transparent; background:none; padding:10px 14px; min-height:44px; font:500 14px var(--sans); color:var(--ink3); cursor:pointer; white-space:nowrap; margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent); font-weight:600}
.tabpanel{padding-top:4px}
.rtable{width:100%; border-collapse:collapse; font-size:14px}
.rtable td{padding:8px 10px; border-bottom:1px solid var(--rule); vertical-align:top; line-height:1.5; color:var(--ink2)}
.rtable td:first-child{width:38%; font:12.5px var(--mono); color:var(--ink); overflow-wrap:anywhere}
.rtable tr:last-child td{border-bottom:0}
/* Machine code bytes */
.mc{display:block; margin-top:2px; font:12px var(--mono); color:var(--t-nl); letter-spacing:.02em}
.k-other{color:var(--ink3)}
.prov{padding:12px 14px; border:1px solid var(--rule); border-radius:10px; background:var(--sunk); font-size:14px; line-height:1.55; color:var(--ink2)}
.prov b{color:var(--ink)}
.hsum{padding:10px 14px; font-size:13px; line-height:1.5; color:var(--ink2); border-bottom:1px solid var(--rule)}
.hsum code{font-size:12px; color:var(--ink)}
.kcount{display:flex; flex-wrap:wrap; gap:6px; padding:10px 14px; border-bottom:1px solid var(--rule)}
.kcount .kind{font-size:11px; padding:2px 8px}
.pathnote{padding:10px 14px; font-size:13px; line-height:1.55; color:var(--ink2); border-bottom:1px solid var(--rule); background:var(--accent-soft)}
.klines h4{margin:0; padding:10px 14px 4px; font-size:12px; font-weight:600; color:var(--ink3)}
.cpu-row.ran{background:var(--accent-soft)}
.kphase{margin:0; padding:12px 14px 4px; font-size:12px; font-weight:600; color:var(--ink2); border-bottom:1px solid var(--rule)}
.ranmark{display:inline-block; margin-left:8px; padding:0 6px; border-radius:999px; background:var(--accent); color:var(--on-accent); font:600 10px var(--sans); vertical-align:2px}
.alllines{border-top:1px solid var(--rule)}
.alllines > summary{display:flex; align-items:center; gap:8px; min-height:44px; padding:0 14px; cursor:pointer; list-style:none; font-size:13px; font-weight:600}
.alllines > summary::-webkit-details-marker{display:none}
.alllines > summary::before{content:"\25B8"; color:var(--ink3); transition:transform .15s ease}
.alllines[open] > summary::before{transform:rotate(90deg)}
.lst-scroll{max-height:440px; overflow:auto; border-top:1px solid var(--rule)}
table.asm{width:100%; border-collapse:collapse; font:12px var(--mono)}
table.asm td{padding:3px 10px; border-bottom:1px solid var(--rule); white-space:nowrap; color:var(--ink2)}
table.asm td.i{color:var(--ink)}
table.asm td.n{color:var(--ink3); text-align:right}
table.asm tr.ran td{background:var(--accent-soft)}
.kd{display:inline-block; width:8px; height:8px; border-radius:50%; background:currentColor}
.pairs-note{padding:10px 14px; font-size:13px; line-height:1.55; color:var(--ink2); border-bottom:1px solid var(--rule); background:var(--surface)}
.pairs-note code{font-size:12px; color:var(--ink)}
.lno{color:var(--ink3); margin-right:10px; white-space:nowrap}
.mc .mcl{font:500 11px var(--sans); color:var(--ink3); margin-right:6px; letter-spacing:0}
.mc i{font-style:normal; color:var(--ink3)}
/* L4 */
.from{display:flex; flex-wrap:wrap; align-items:center; gap:8px; font:18px var(--mono)}
.from .lbl{font:13px var(--sans); color:var(--ink3); margin-right:4px}
.from .tk{padding:4px 10px; border:1.5px solid var(--rule2); border-radius:8px}
.from .sign{border-style:dashed; color:var(--t-nl); border-color:var(--t-nl)}
.arrow-down{font-size:13px; color:var(--ink3)}
.boxes{overflow-x:auto; padding:2px}
.box{border:1.5px solid var(--rule2); border-radius:12px; padding:10px 12px 12px; display:grid; gap:10px; min-width:max-content; transition:border-color .15s, background-color .15s}
.box.b-mod{border-style:dashed}
.box.on{border-color:var(--accent); background:var(--accent-soft)}
.box-lbl{justify-self:start; border:0; padding:4px 8px; border-radius:6px; font-size:14px; font-weight:600; background:var(--sunk)}
.box-lbl:hover{background:var(--rule)}
.call-row{display:flex; flex-wrap:wrap; gap:14px 18px; align-items:flex-start; padding:4px 4px 0}
.leaf{display:flex; flex-direction:column; gap:6px; align-items:flex-start}
.leaf-btn{font:22px var(--mono); padding:10px 14px; min-height:54px; white-space:pre}
.leaf-btn.lf-name{border-color:var(--t-name)} .leaf-btn.lf-str{border-color:var(--t-str)}
.leaf-cap{font-size:13px; color:var(--ink2)}
/* L5 */
.step-grid{display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:20px}
.bsteps{list-style:none; margin:0; padding:0; display:grid; gap:4px; align-content:start}
.bstep{width:100%; display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:10px; align-items:center; min-height:40px; padding:4px 10px; text-align:left; border-color:transparent}
.bstep:hover{background:var(--sunk)}
.bstep .n{font:12px var(--mono); color:var(--ink3)}
.bstep .w{font-size:15px}
.bstep .op{font:11px var(--mono); color:var(--ink3); white-space:nowrap}
.bstep.done .w{color:var(--ink2)}
.bstep.future .w{color:var(--ink3)}
.mem{display:grid; gap:12px; align-content:start; min-width:0}
.plates{display:flex; flex-direction:column-reverse; gap:5px; min-height:142px; padding:8px; border:1.5px dashed var(--rule2); border-radius:10px; background:var(--surface)}
.plate{height:38px; border-radius:999px; border:1.5px solid var(--ink3); background:var(--surface); display:flex; align-items:center; justify-content:center; gap:8px; font:13px var(--mono); position:relative; animation:drop .25s ease-out; padding:0 40px}
.plate.top::after{content:"top"; position:absolute; right:12px; font:11px var(--sans); color:var(--ink3)}
.plate.empty{border-style:dashed; color:var(--ink3)}
@keyframes drop{from{transform:translateY(-10px); opacity:0}to{transform:none; opacity:1}}
.no-plates{margin:auto; font-size:13px; color:var(--ink3)}
.shelf{display:grid; gap:6px}
.obj{display:grid; grid-template-columns:26px minmax(0,1fr) auto; align-items:center; gap:8px; padding:7px 10px; border:1.5px solid var(--rule); border-radius:10px; background:var(--surface); font-size:14px; transition:border-color .2s, opacity .2s}
.obj.used{border-color:var(--accent)}
.obj.idle{opacity:.55}
.badge{width:22px; height:22px; border-radius:6px; display:grid; place-items:center; font:600 12px var(--mono); background:var(--ink); color:var(--surface)}
.obj .sz{font:12px var(--mono); color:var(--ink3)}
.lists{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.4fr); gap:8px}
.lst{display:grid; gap:4px; align-content:start}
.lst h4{margin:0; font-size:12px; font-weight:600; color:var(--ink3)}
.li{display:flex; gap:8px; align-items:center; padding:5px 8px; border:1.5px solid var(--rule); border-radius:8px; background:var(--surface); font:13px var(--mono); transition:border-color .2s}
.li i{font-style:normal; color:var(--ink3)}
.li.use{border-color:var(--accent); background:var(--accent-soft)}
.ctl{display:flex; flex-wrap:wrap; gap:8px}
.fine{margin:0; font-size:13px; color:var(--ink3)}
/* L6 + L7 */
.split{display:grid; grid-template-columns:200px minmax(0,1fr); gap:18px}
.ilist{display:flex; flex-direction:column; gap:4px; min-width:0}
.ibtn{display:flex; align-items:center; gap:10px; min-height:40px; padding:0 10px; font-size:14px; text-align:left; border-color:transparent}
.ibtn:hover{background:var(--sunk)}
.ibtn .o{font:12px var(--mono); color:var(--ink3); min-width:14px}
.ibtn.hk{color:var(--ink3)}
.loop{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; counter-reset:lp}
.lp{position:relative; padding:10px 12px; border:1.5px solid var(--rule2); border-radius:10px; background:var(--surface); font-size:13px; color:var(--ink2); line-height:1.45}
.lp b{display:block; font-size:12px; color:var(--ink3); font-weight:600; margin-bottom:2px}
.lp.now{border-color:var(--accent); background:var(--accent-soft); color:var(--ink)}
.loop-note{margin:6px 0 0; font-size:12px; color:var(--ink3)}
.pairs{min-width:0; border:1px solid var(--rule); border-radius:10px; overflow:hidden; background:var(--sunk)}
.pairs-head{display:flex; justify-content:space-between; gap:6px 12px; flex-wrap:wrap; padding:10px 14px; border-bottom:1px solid var(--rule); font-size:13px; color:var(--ink3)}
.pairs-head b{color:var(--ink); font-weight:600}
.pair{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.2fr); gap:6px 18px; padding:10px 14px; border-bottom:1px solid var(--rule); align-items:baseline}
.pair:last-child{border-bottom:0}
.pair:hover{background:var(--accent-soft)}
.pair .say{font-size:15px; color:var(--ink)}
.pair .say i{font-style:normal; color:var(--ink3); font:12px var(--mono); margin-right:8px}
.pair code{font-size:12.5px; color:var(--ink2); overflow-wrap:anywhere}
.measure{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px}
.m-card{padding:12px 14px; border:1.5px dotted var(--rule2); border-radius:10px; background:var(--surface)}
.m-card b{display:block; font:600 22px var(--mono); color:var(--ink)}
.m-card span{font-size:13px; color:var(--ink2)}
.kinds{display:flex; flex-wrap:wrap; gap:8px}
.kind{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:600; border:1.5px solid currentColor}
.k-move{color:var(--k-move)} .k-math{color:var(--k-math)} .k-cmp{color:var(--k-cmp)} .k-jump{color:var(--k-jump)}
.tracks{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px}
.track{padding:10px 12px; border:1.5px solid var(--rule2); border-radius:10px; background:var(--surface); display:grid; gap:3px}
.track b{font-size:13px}
.track span{font:13px var(--mono); color:var(--ink2); overflow-wrap:anywhere}
.track span em{font-style:normal; color:var(--accent); font-weight:600}
.track small{font-size:12px; color:var(--ink3)}
.track.here{border-color:var(--accent)}
@media (max-width:920px){ .tracks{grid-template-columns:minmax(0,1fr)} }
.illus{padding:12px 14px; border:1.5px solid var(--t-nl); border-radius:10px; color:var(--ink2); font-size:14px; line-height:1.55}
.illus b{color:var(--t-nl)}
.cpu-row{display:grid; grid-template-columns:86px minmax(0,1fr); gap:4px 12px; align-items:start; padding:7px 14px; border-bottom:1px solid var(--rule)}
.cpu-row:last-child{border-bottom:0}
.cpu-row .kind{justify-self:start; font-size:11px; padding:2px 8px}
.cpu-row .say{font-size:15px}
.cpu-row code{display:block; font-size:12px; color:var(--ink3); margin-top:1px; white-space:pre; overflow-x:auto}
.fde{display:flex; flex-wrap:wrap; align-items:center; gap:8px; font-size:14px; color:var(--ink2)}
.fde > span:first-child{flex-basis:100%}
.fde span.s{padding:6px 12px; border:1.5px solid var(--rule2); border-radius:999px; background:var(--surface); color:var(--ink); font-weight:500}
.regs{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:8px}
.reg{border:1.5px solid var(--rule2); border-radius:10px; padding:8px 10px; background:var(--surface)}
.reg b{font:600 13px var(--mono)}
.reg span{display:block; font-size:13px; color:var(--ink2)}
/* L8 */
.zones{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); border:1.5px solid var(--rule2); border-radius:12px; overflow:hidden}
.zone{min-height:150px; padding:12px; display:flex; flex-direction:column; gap:8px; border-right:1px solid var(--rule); transition:background-color .25s; min-width:0}
.zone:last-child{border-right:0}
.zone.wall{border-right:0; border-left:4px double var(--ink3); background:repeating-linear-gradient(135deg, transparent 0 8px, var(--sunk) 8px 16px)}
.zone.on{background:var(--accent-soft)}
.zone h3{margin:0; font-size:14px; font-weight:600}
.zone p{margin:0; font-size:12px; color:var(--ink3)}
.packet{align-self:flex-start; margin-top:auto; display:inline-flex; align-items:center; padding:6px 10px; border-radius:8px; background:var(--ink); color:var(--surface); font:12px var(--mono); animation:slide .45s ease-out; max-width:100%; overflow-wrap:anywhere}
@keyframes slide{from{transform:translateX(-24px); opacity:0}to{transform:none; opacity:1}}
.osteps{list-style:none; margin:0; padding:0; display:grid; gap:6px}
.ostep{width:100%; display:grid; grid-template-columns:26px minmax(0,1fr); gap:10px; padding:10px 12px; text-align:left; align-items:start}
.ostep .n{font:600 13px var(--mono); color:var(--ink3)}
.ostep .w{font-size:15px}
.ostep code{display:block; margin-top:2px; font-size:13px; color:var(--ink2); overflow-wrap:anywhere}
.doors{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
.door{padding:10px 12px; border:1.5px solid var(--rule2); border-radius:10px; background:var(--surface); font-size:13px; color:var(--ink2)}
.door b{display:block; font:600 20px var(--mono); color:var(--ink)}
.door.use{border-color:var(--accent); background:var(--accent-soft)}
/* L9 */
.journey{display:flex; flex-wrap:wrap; align-items:center; gap:8px; font-size:13px; color:var(--ink3)}
.jstep{display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 12px; border:1.5px solid var(--rule2); border-radius:10px; background:var(--surface); min-width:74px}
.jstep b{font:600 18px var(--mono); color:var(--ink)}
.px-line{display:flex; align-items:center; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--ink3)}
.px-line canvas{border:1px dashed var(--rule2); border-radius:6px; background:var(--surface); max-width:100%}
.glyphs{display:flex; flex-wrap:wrap; gap:6px}
.glyph{width:44px; height:48px; font:20px var(--mono)}
.glyph.sp{font:12px var(--sans); color:var(--ink3)}
.px-big{display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap}
.px-big canvas{max-width:100%; border-radius:4px}
.px-stats{display:grid; gap:8px; font:13px var(--mono); color:var(--ink3); min-width:0; flex:1 1 200px}
.px-stats b{color:var(--ink); font-weight:600}
.sw{display:inline-block; width:12px; height:12px; border:1px solid var(--rule2); vertical-align:-1px; margin-right:6px}
.olsw{display:inline-block; width:14px; border-top:2px solid var(--accent); vertical-align:3px; margin-right:6px}
.screen-fact{padding:12px 14px; border:1.5px dotted var(--rule2); border-radius:10px; font-size:14px; color:var(--ink2)}
.screen-fact b{color:var(--ink)}
.rgb{display:inline-flex; gap:2px; vertical-align:-2px; margin:0 4px}
.rgb i{width:5px; height:14px; border-radius:1px}

/* Selection goes last so it wins */
.el.sel{border-color:var(--accent); background:var(--accent-soft); box-shadow:0 0 0 3px var(--accent-soft)}
.el.sel .b-num,.el.sel .o{color:var(--accent)}
.bstep.sel .w{color:var(--ink); font-weight:600}
.box-lbl.sel{box-shadow:none; background:var(--accent); color:var(--on-accent)}

/* Detail + try it */
.detail{display:grid; gap:10px; max-width:780px}
.detail h2{margin:0; font-size:20px; font-weight:600; line-height:1.3; text-wrap:balance}
.detail p{margin:0; max-width:65ch; font-size:16px; line-height:1.65; color:var(--ink2)}
.detail p b{color:var(--ink); font-weight:600}
.detail p code{font-size:.92em; color:var(--ink)}
.actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px}
.try{border:1px solid var(--rule); border-radius:12px; background:var(--surface); max-width:860px}
.try > summary{display:flex; align-items:center; gap:10px; min-height:52px; padding:0 16px; cursor:pointer; list-style:none; font-size:14px; font-weight:600}
.try > summary::-webkit-details-marker{display:none}
.try > summary::before{content:"\25B8"; display:inline-block; width:10px; color:var(--ink3); transition:transform .15s ease}
.try[open] > summary::before{transform:rotate(90deg)}
.try > summary code{font-weight:400; font-size:13px; color:var(--ink2); background:var(--sunk); border:1px solid var(--rule); border-radius:6px; padding:2px 8px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.try-body{display:grid; gap:12px; padding:0 16px 16px}
.try h3{margin:0; font-size:16px; font-weight:600}
.try h4{margin:0 0 6px; font-size:13px; font-weight:600; color:var(--ink2)}
.try p{margin:0; font-size:14px; line-height:1.6; color:var(--ink2); max-width:70ch}
.try a{color:var(--accent); text-underline-offset:3px}
.cmd{display:flex; align-items:stretch; border:1px solid var(--rule); border-radius:10px; overflow:hidden; background:var(--surface)}
.cmd code{flex:1; min-width:0; padding:10px 14px; font-size:13.5px; overflow-x:auto; white-space:pre}
.cmd button{border:0; border-left:1px solid var(--rule); background:var(--sunk); padding:0 14px; cursor:pointer; font-size:13px; min-height:44px}
.cmd button:hover{color:var(--accent)}
.tgrid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.2fr); gap:14px}
.parts-list{margin:0; display:grid; gap:8px}
.parts-list div{display:grid; gap:2px}
.parts-list dt code{font-size:12.5px; color:var(--ink); background:var(--sunk); border:1px solid var(--rule); border-radius:5px; padding:1px 6px; overflow-wrap:anywhere}
.parts-list dd{margin:0; font-size:13.5px; color:var(--ink2)}
pre.out{margin:0; padding:12px 14px; border-radius:10px; border:1px solid var(--rule2); background:var(--term-bg); color:var(--term-fg); font:12.5px/1.55 var(--mono); overflow-x:auto; white-space:pre-wrap; overflow-wrap:anywhere}
.read{margin:0; padding-left:18px; display:grid; gap:6px; font-size:14px; line-height:1.6; color:var(--ink2); max-width:72ch}
.read b{color:var(--ink); font-weight:600}
.read code{font-size:.92em; color:var(--ink)}

/* Concept dialog */
dialog{border:1px solid var(--rule); border-radius:16px; padding:0; max-width:min(600px, calc(100vw - 32px)); width:100%; max-height:calc(100vh - 48px); background:var(--surface); color:var(--ink)}
dialog::backdrop{background:rgba(15,15,14,.45)}
.dlg{padding:20px 22px 22px; display:grid; gap:14px}
.dlg-bar{display:flex; justify-content:space-between; align-items:center; gap:8px}
.dlg-kicker{font-size:12px; font-weight:600; color:var(--ink3)}
.dlg h2{margin:0; font-size:24px; font-weight:600; line-height:1.2}
.dlg .like{margin:6px 0 0; font-size:16px; color:var(--ink2); font-style:italic}
.dlg p{margin:0; font-size:15px; line-height:1.65; color:var(--ink2)}
.dlg p b{color:var(--ink)}
.facts{display:grid; grid-template-columns:auto minmax(0,1fr); gap:6px 14px; font-size:14px; margin:0}
.facts dt{color:var(--ink3)}
.facts dd{margin:0}
.yours{padding:12px 14px; border-radius:10px; background:var(--accent-soft); font-size:14px; line-height:1.55}
.yours b{display:block; font-size:12px; color:var(--ink3); font-weight:600; margin-bottom:2px}
.ladder{display:grid; gap:6px}
.ladder h3{margin:0; font-size:13px; font-weight:600; color:var(--ink2)}
.rung{display:grid; grid-template-columns:92px minmax(0,1fr); gap:10px; align-items:center; font-size:13px}
.rung .bar{height:18px; border-radius:4px; background:var(--rule2); position:relative}
.rung.me .bar{background:var(--accent)}
.rung .bar span{position:absolute; left:calc(100% + 8px); top:50%; transform:translateY(-50%); white-space:nowrap; color:var(--ink2); font-size:12px}
.rung .bar.full span{left:auto; right:8px; color:var(--surface)}
.rung.me .bar.full span{color:var(--on-accent)}
.ladder small{font-size:12px; color:var(--ink3)}
.ctable{width:100%; border-collapse:collapse; font-size:14px}
.ctable th{text-align:left; font-size:12px; font-weight:600; color:var(--ink3); padding:4px 8px; border-bottom:1px solid var(--rule)}
.ctable td{padding:6px 8px; border-bottom:1px solid var(--rule); font-family:var(--mono)}
.ctable td:first-child{font-size:18px}
.related{display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:13px; color:var(--ink3)}
.chip{height:34px; padding:0 12px; border:1px solid var(--rule); border-radius:999px; background:var(--surface); font:13px var(--sans); color:var(--ink); cursor:pointer; white-space:nowrap}
.chip:hover{border-color:var(--accent); color:var(--accent)}
.idx-group{display:grid; gap:8px}
.idx-group h3{margin:0; font-size:13px; font-weight:600; color:var(--ink3)}
.idx-group div{display:flex; flex-wrap:wrap; gap:6px}

@media (max-width:1180px){ .body{grid-template-columns:270px 150px minmax(0,1fr)} }
@media (max-width:920px){
  .body{grid-template-columns:minmax(0,1fr)}
  .side{border-right:0; border-bottom:1px solid var(--rule); padding:16px; gap:16px}
  .keys{display:none}
  .map-details summary{display:flex; align-items:center; min-height:44px; cursor:pointer; font-size:13px; font-weight:600; color:var(--ink2)}
  .gauge{flex-direction:row; align-items:stretch; gap:6px; overflow-x:auto; padding:8px 12px 0; border-right:0; border-bottom:1px solid var(--rule)}
  .g-group,.g-legend{display:none}
  .g-list{display:flex; border-left:0; border-bottom:2px solid var(--rule)}
  .g-machine{border-bottom-style:dashed}
  .g-item{flex-direction:column; justify-content:flex-end; height:auto; min-width:52px; padding:6px 6px 0; gap:2px; border-radius:8px 8px 0 0}
  .g-tick{order:3; width:100%; height:2px; margin:4px 0 -2px}
  .g-item.current .g-tick{width:100%; height:3px}
  .g-label{font-size:12px; white-space:nowrap}
  .g-handoff{margin:0; padding:0 8px; border-block:0; border-inline:1px dashed var(--rule2); justify-content:center; white-space:nowrap}
  .g-handoff span,.g-handoff .long{display:none}
  .split,.step-grid,.tgrid{grid-template-columns:minmax(0,1fr)}
  .ilist{flex-direction:row; overflow-x:auto; padding-bottom:4px}
  .ibtn{flex:none}
  .pair{grid-template-columns:minmax(0,1fr)}
  .loop{grid-template-columns:repeat(2,minmax(0,1fr))}
  .zones{grid-template-columns:repeat(2,minmax(0,1fr))}
  .zone{min-height:120px; border-bottom:1px solid var(--rule)}
  .zone.wall{border-left:0; border-top:4px double var(--ink3)}

  if (L===1){ on.disk=1; note.disk='hello.py saved here'; }
  if (L===2){ on.disk=1; note.disk='hello.py \u00b7 22 bytes'; }
  if (L===3){ on.ram=1; note.ram='the 22 bytes, copied from disk, now read as tokens'; note.disk='hello.py \u00b7 22 bytes'; }
  if (L===4){ on.ram=1; note.ram='the boxes: 5 of them, temporary'; }
  if (L===5){
    var plates = PLATES[el.idx], used = {};
    on.code=1; on.heap=1; on.stack=1; on.ram=1;
    note.code='step '+(el.idx+1)+' of 8';
    note.stack = plates.length ? plates.length+' plate'+(plates.length>1?'s':'') : 'no plates';
    plates.forEach(function(p){ if (p!=='0') used[p]=1; });
    note.heap = Object.keys(used).length ? Object.keys(used).length+' in use' : '3 objects';
  }
  if (L===6){ on.py=1; on.code=1; on.ram=1; on.cpu=1; note.py='running the C for step '+(el.idx+1); note.code='step '+(el.idx+1)+' of 8'; }
  if (L===7){ on.cpu=1; on.reg=1; on.cache=1; on.py=1; on.ram=1; note.reg='bookmark, top plate, frame'; note.cache='busy machine code'; note.py='machine code for step '+(el.idx+1); }
  if (L===8){ on.os=1; note.os = el.idx>=2 ? 'door 1 \u2192 terminal \u00b7 13 bytes' : 'not asked yet'; if (el.idx<2){ on.ram=1; note.ram='13 bytes waiting in a buffer'; } }
  if (L===9){ on.screen=1; note.screen=screenPx().label; }
  return {on:on, note:note};
}

    return '<button type="button" class="part on" data-term="'+k+'"><span class="p-top"><span class="p-name">'+p.name+(p.sub?'<small>'+p.sub+'</small>':'')+'</span>'+(p.speed?'<span class="p-speed">'+p.speed+'</span>':'')+'</span><span class="p-note">'+esc(note[k]||'')+'</span></button>';

  view.animate([{opacity:1, transform:'scale(1)'},{opacity:0, transform: zin?'scale(1.35)':'scale(0.9)'}], {duration:120, easing:'cubic-bezier(.4,0,1,1)'}).onfinish = function(){
    commit(); view.style.transformOrigin = '50% 0';
    view.animate([{opacity:0, transform: zin?'scale(0.95)':'scale(1.05)'},{opacity:1, transform:'scale(1)'}], {duration:170, easing:'cubic-bezier(0,0,.2,1)'}).onfinish = function(){ busy = false; };
  };
}
function zoomIn(focus){ if (state.level<9) go(state.level+1, null, 'in', {focus:focus}); }
function zoomOut(focus){ if (state.level>1) go(state.level-1, null, 'out', {focus:focus}); }
function select(id, focus){
  state.el = E[id]; renderSide(); renderView();
  if (focus) { var s = document.querySelector('#view [data-el="'+id+'"]'); if (s) s.focus({preventScroll:true}); }
}
function step(delta){
  var list = LV[state.level], i = list.indexOf(state.el), j = Math.max(0, Math.min(list.length-1, i+delta));
  if (j!==i) select(list[j].id, false);
  return j!==i;
}
function play(){
  if (playing) { stopPlay(); renderView(); return; }
  playing = true;
  if (state.el.idx===7) select('bc-1', false); else renderView();
  (function tick(){
    playTimer = setTimeout(function(){
      if (!playing || state.level!==5) { stopPlay(); return; }
      if (!step(1) || state.el.idx===7) { stopPlay(); renderView(); return; }
      tick();
    }, reduce.matches ? 1400 : 1100);
  })();
}

document.addEventListener('click', function(e){
  var t = e.target.closest('button'); if (!t || t.disabled) return;
  var dlg = document.getElementById('dlg');
  if (t.hasAttribute('data-close')) { dlg.close(); return; }
  if (t.hasAttribute('data-dlgback')) { dlgHistory.pop(); var prev = dlgHistory[dlgHistory.length-1]; if (prev==='__index') openIndex(); else openCard(prev, false); return; }
  if (t.hasAttribute('data-index')) { openIndex(); return; }
  if (t.hasAttribute('data-label')) { if (!dlg.open) dlgHistory = []; openCard('labels'); return; }
  if (t.hasAttribute('data-tab')) { setTab(t.getAttribute('data-tab')); return; }
  if (t.hasAttribute('data-term')) { if (!dlg.open) dlgHistory = []; openCard(t.getAttribute('data-term')); return; }
  if (t.id==='conceptsBtn') { openIndex(); return; }
  if (t.hasAttribute('data-el')) { stopPlay(); select(t.getAttribute('data-el'), true); }
  else if (t.hasAttribute('data-go')) { var L = +t.getAttribute('data-go'); go(L, null, L>state.level?'in':L<state.level?'out':'none'); }
  else if (t.hasAttribute('data-zoom')) { if (t.getAttribute('data-zoom')==='in') zoomIn(false); else zoomOut(false); }
  else if (t.hasAttribute('data-step')) { stopPlay(); step(+t.getAttribute('data-step')); var nb = document.querySelector('[data-step="'+t.getAttribute('data-step')+'"]'); if (nb && !nb.disabled) nb.focus({preventScroll:true}); }
  else if (t.hasAttribute('data-play')) { play(); }
  else if (t.hasAttribute('data-copy')) {
    var txt = t.getAttribute('data-copy');
    var done = function(){ t.textContent = 'Copied'; setTimeout(function(){ t.textContent = 'Copy'; }, 1400); };
    var fallback = function(){ var c = t.previousElementSibling, r = document.createRange(); r.selectNodeContents(c); var s = getSelection(); s.removeAllRanges(); s.addRange(r); t.textContent = 'Selected'; setTimeout(function(){ t.textContent = 'Copy'; }, 1400); };
    try { navigator.clipboard.writeText(txt).then(done, fallback); } catch(err) { fallback(); }
  }
});
document.getElementById('dlg').addEventListener('click', function(e){ if (e.target===this) this.close(); });

function setTab(k){
  state.tryTab = k;
  state.tryOpen = true;
  var sec = document.querySelector('#view .try');
  if (sec) { sec.outerHTML = tryHtml(state.level); var b = document.getElementById('tab-'+k); if (b) b.focus({preventScroll:true}); }
}
document.addEventListener('keydown', function(e){
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (document.getElementById('dlg').open) return;
  var tg = e.target, tag = tg && tg.tagName;
  if (tg && tg.getAttribute && tg.getAttribute('role')==='tab' && (e.key==='ArrowRight' || e.key==='ArrowLeft')) {
    e.preventDefault();
    var ks = TABS.map(function(x){ return x[0]; }), i = ks.indexOf(state.tryTab);
    setTab(ks[(i + (e.key==='ArrowRight' ? 1 : ks.length-1)) % ks.length]);
    return;
  }
  if (tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT' || (tg && tg.isContentEditable)) return;
  var list = LV[state.level], idx = list.indexOf(state.el);
  if (e.key==='ArrowRight') { e.preventDefault(); stopPlay(); select(list[Math.min(list.length-1, idx+1)].id, true); }
  else if (e.key==='ArrowLeft') { e.preventDefault(); stopPlay(); select(list[Math.max(0, idx-1)].id, true); }
  else if (e.key==='ArrowDown') { e.preventDefault(); zoomIn(true); }
  else if (e.key==='ArrowUp') { e.preventDefault(); zoomOut(true); }
});
document.addEventListener('toggle', function(e){ if (e.target && e.target.id==='tryBox') state.tryOpen = e.target.open; }, true);
window.addEventListener('hashchange', function(){
  if (skipHash) { skipHash = false; return; }
  var mm = /^#level-([1-9])$/.exec(location.hash);
  if (mm && +mm[1]!==state.level) go(+mm[1], null, +mm[1]>state.level?'in':'out', {noHash:true});
});

/* ---------- Theme ---------- */
var root = document.documentElement, themeBtn = document.getElementById('themeBtn');
var darkMQ = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : {matches:false};
function isDark(){ var d = root.getAttribute('data-theme'); return d ? d==='dark' : darkMQ.matches; }
function paintThemeBtn(){
  var dark = isDark();
  themeBtn.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
  themeBtn.innerHTML = dark
    ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>'
    : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>';
}
try { var th = localStorage.getItem('eti-theme'); if (th==='dark' || th==='light') root.setAttribute('data-theme', th); } catch(e) {}
themeBtn.addEventListener('click', function(){
  var next = isDark() ? 'light' : 'dark'; root.setAttribute('data-theme', next);
  try { localStorage.setItem('eti-theme', next); } catch(e) {}
  paintThemeBtn(); if (state.level===9) drawPixels();
});
if (darkMQ.addEventListener) darkMQ.addEventListener('change', function(){ paintThemeBtn(); if (state.level===9) drawPixels(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ if (state.level===9) drawPixels(); });
var rsz; window.addEventListener('resize', function(){ clearTimeout(rsz); rsz = setTimeout(function(){ if (state.level===9) drawPixels(); }, 150); });
try { if (window.matchMedia('(max-width: 920px)').matches) document.getElementById('mapDetails').removeAttribute('open'); } catch(e) {}

paintThemeBtn();
renderAll();
})();
</script>
