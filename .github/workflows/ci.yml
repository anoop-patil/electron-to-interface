name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Typecheck, Vitest and Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  python:
    name: pytest on CPython 3.14.2
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.2'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  deploy:
    name: Deploy to Cloudflare Pages
    # Only a push to main deploys, and only once every check has passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web, python]
    runs-on: ubuntu-latest
    # Deploys run one at a time, in push order.
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4.147.0
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      # The first deploy creates the Pages project.
      - run: $WRANGLER pages project list | grep -qw electrontointerface || $WRANGLER pages project create electrontointerface --production-branch main
      - id: pages
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.147.0
          workingDirectory: app
          command: pages deploy dist --project-name electrontointerface --branch main --commit-hash ${{ github.sha }}
      - run: npx playwright install --with-deps chromium
      # A new deploy's URL can take a few minutes to answer over HTTPS; on the first deploy its certificate didn't exist yet.
      - run: curl --silent --fail --output /dev/null --retry 30 --retry-delay 10 --retry-all-errors "$LIVE_URL"
        env:
          LIVE_URL: ${{ steps.pages.outputs.deployment-url }}
      # Smoke-tests this deploy at its own URL, so it checks exactly what was uploaded.
      - run: npx playwright test --config playwright.live.config.ts
        env:
          LIVE_URL: ${{ steps.pages.outputs.deployment-url }}
